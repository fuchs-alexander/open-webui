name: cliproxyapi

# CLIProxyAPI als privates Gateway fuer Open WebUI auf tposylka.
# Live-Stack: /opt/docker/cliproxyapi (config.yaml 0400, auths/ 0700, uid 10001).
# Kein Host-Port fuer die Inferenz; Open WebUI erreicht http://cliproxyapi:8317/v1
# ueber das bestehende Netz open-webui_default.

x-image: &image eceasy/cli-proxy-api:v8.0.43@sha256:3f74ca56cba8bea2a2a096a215bb774482d87d257da04c5047e6046493bfd644

x-hardening: &hardening
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment:
    TZ: Europe/Berlin
    HOME: /tmp
    # Erzwungene Fehler-Logs enthalten Request-Bodies. Ohne diese Variable weicht
    # CLIProxyAPI auf <auth-dir>/logs aus; so zeigt es ins schreibgeschuetzte Image.
    WRITABLE_PATH: /CLIProxyAPI
  volumes:
    - ./config.yaml:/CLIProxyAPI/config.yaml:ro
    - ./auths:/data/auths

services:
  cliproxyapi:
    <<: *hardening
    image: *image
    container_name: cliproxyapi
    restart: unless-stopped
    command: ["./CLIProxyAPI", "-config", "/CLIProxyAPI/config.yaml"]
    networks:
      - open-webui
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Nur fuer die Erstanmeldung: Callback-Ports ausschliesslich auf Host-Loopback,
  # erreichbar per SSH-Tunnel vom Betreiber-PC. Nach dem Login sofort entfernen.
  login:
    <<: *hardening
    image: *image
    profiles: ["login"]
    entrypoint: ["./CLIProxyAPI", "-config", "/CLIProxyAPI/config.yaml", "-no-browser"]
    networks:
      - login
    ports:
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:54545:54545"
    mem_limit: 256m
    pids_limit: 128

networks:
  open-webui:
    external: true
    name: open-webui_default
  login: {}
